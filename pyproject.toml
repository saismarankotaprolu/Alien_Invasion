[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alien-invasion"
version = "0.1.0"
description = "A classic arcade-style alien invasion game built with Python and Pygame."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pygame>=2.5,<3",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.5,<5",
    "pytest>=8,<9",
    "ruff>=0.11,<1",
]

[project.scripts]
alien-invasion = "alien_invasion.game:main"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
